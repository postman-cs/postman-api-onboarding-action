name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_kind: ${{ steps.release_tag.outputs.release_kind }}
      npm_publish: ${{ steps.release_tag.outputs.npm_publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Classify release tag
        id: release_tag
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH _ <<< "$PKG_VERSION"
          IMMUTABLE=("v$PKG_VERSION")
          if [ "$PATCH" = "0" ]; then IMMUTABLE+=("v$MAJOR.$MINOR"); fi
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error::Release workflow must run from an accepted immutable tag; got $GITHUB_REF; expected ${IMMUTABLE[*]} or v$MAJOR"
            exit 1
          fi
          if [[ " ${IMMUTABLE[*]} " == *" $GITHUB_REF_NAME "* ]]; then
            echo 'release_kind=immutable' >> "$GITHUB_OUTPUT"
            echo 'npm_publish=true' >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "v$MAJOR" ]; then
            echo 'release_kind=alias' >> "$GITHUB_OUTPUT"
            echo 'npm_publish=false' >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REF_NAME is a rolling alias; no release work will run."
          else
            echo "::error::Release workflow must run from an accepted immutable tag; got $GITHUB_REF; expected ${IMMUTABLE[*]} or v$MAJOR"
            exit 1
          fi

  verify-package:
    needs: classify
    if: needs.classify.outputs.release_kind == 'immutable'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tgz_sha256: ${{ steps.package-artifact.outputs.release_tgz_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/393031adb9afb225ee52ae2ccd7a5af5525e03e8/scripts/download-actionlint.bash) 1.7.11 "$RUNNER_TEMP"
          echo "ACTIONLINT_BIN=$RUNNER_TEMP/actionlint" >> "$GITHUB_ENV"
      - name: Run gates
        run: |
          set -uo pipefail
          declare -A pid=() result=(); declare -a names=(); MAX_PARALLEL_GATES=2
          finish_one() { local finished_pid status n; if wait -n -p finished_pid "${pid[@]}"; then status=0; else status=$?; fi; for n in "${!pid[@]}"; do if [ "${pid[$n]}" = "$finished_pid" ]; then result[$n]=$status; unset 'pid[$n]'; return; fi; done; }
          run() { while [ "${#pid[@]}" -ge "$MAX_PARALLEL_GATES" ]; do finish_one; done; local n=$1; shift; names+=("$n"); ( "$@" ) >"$n.log" 2>&1 & pid[$n]=$!; }
          run lint npm run lint
          run typecheck npm run typecheck
          run test npm test
          run sibling-pins node scripts/check-sibling-pins.mjs
          run actionlint "$ACTIONLINT_BIN"
          while [ "${#pid[@]}" -gt 0 ]; do finish_one; done
          fail=0; for n in "${names[@]}"; do if [ "${result[$n]}" -eq 0 ]; then echo "gate:$n=pass"; else echo "gate:$n=fail"; fail=1; fi; done; for n in "${names[@]}"; do echo "::group::$n"; cat "$n.log"; echo '::endgroup::'; done; exit $fail
      - name: Package release artifact
        id: package-artifact
        run: |
          set -euo pipefail
          npm pack --pack-destination .
          mv ./*.tgz release.tgz
          SHA256=$(shasum -a 256 release.tgz | awk '{print $1}')
          echo "release_tgz_sha256=$SHA256" >> "$GITHUB_OUTPUT"
          SHA256="$SHA256" node -e "const fs=require('fs');const p=require('./package.json');fs.writeFileSync('release-manifest.json',JSON.stringify({schema_version:1,repository:process.env.GITHUB_REPOSITORY,commit_sha:process.env.GITHUB_SHA,tag:process.env.GITHUB_REF_NAME,package_name:p.name,package_version:p.version,artifacts:[{path:'release.tgz',sha256:process.env.SHA256}]},null,2))"
          node scripts/verify-release-artifacts.mjs .
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release.tgz
            release-manifest.json
          if-no-files-found: error

  publish:
    needs: [classify, verify-package]
    if: needs.classify.outputs.release_kind == 'immutable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.npm-publish.outputs.published }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Verify release artifact envelope
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const directory = 'release';
          const tarballPath = join(directory, 'release.tgz');
          const manifest = JSON.parse(readFileSync(join(directory, 'release-manifest.json'), 'utf8'));
          if (manifest.schema_version !== 1) throw new Error('unsupported manifest schema');
          for (const key of ['repository', 'commit_sha', 'tag', 'package_name', 'package_version']) {
            if (typeof manifest[key] !== 'string' || manifest[key].length === 0) {
              throw new Error(`manifest ${key} must be a non-empty string`);
            }
          }
          for (const [key, expected] of Object.entries({
            repository: process.env.GITHUB_REPOSITORY,
            commit_sha: process.env.GITHUB_SHA,
            tag: process.env.GITHUB_REF_NAME
          })) {
            if (manifest[key] !== expected) throw new Error(`${key} does not match this release`);
          }
          if (!Array.isArray(manifest.artifacts) || manifest.artifacts.length !== 1) {
            throw new Error('manifest artifact allowlist is invalid');
          }
          const artifact = manifest.artifacts[0];
          if (artifact.path !== 'release.tgz' || typeof artifact.sha256 !== 'string' || !/^[a-f0-9]{64}$/.test(artifact.sha256)) {
            throw new Error('manifest artifact is invalid');
          }
          const actual = createHash('sha256').update(readFileSync(tarballPath)).digest('hex');
          if (actual !== artifact.sha256) throw new Error('checksum mismatch for release.tgz');
          const packageJson = JSON.parse(execFileSync('tar', ['-xOf', tarballPath, 'package/package.json'], { encoding: 'utf8' }));
          if (packageJson.name !== manifest.package_name) throw new Error('tarball package name does not match manifest');
          if (packageJson.version !== manifest.package_version) throw new Error('tarball package version does not match manifest');
          const [major, minor, patch] = String(packageJson.version).split('.');
          const allowed = [`v${packageJson.version}`];
          if (patch === '0') allowed.push(`v${major}.${minor}`);
          if (!allowed.includes(process.env.GITHUB_REF_NAME)) {
            throw new Error(`tag ${process.env.GITHUB_REF_NAME} does not match package version ${packageJson.version}`);
          }
          NODE
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            release/release.tgz
            release/release-manifest.json
      - name: Publish npm package
        id: npm-publish
        continue-on-error: true
        run: |
          set -euo pipefail
          sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "published=false" >> "$GITHUB_OUTPUT"
          PKG_NAME=$(tar -xOf release/release.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name")
          PKG_VERSION=$(tar -xOf release/release.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          SRI="sha512-$(openssl dgst -sha512 -binary release/release.tgz | openssl base64 -A)"
          if EXISTING=$(npm view "$PKG_NAME@$PKG_VERSION" dist.integrity 2>/dev/null); then
            [ "$EXISTING" = "$SRI" ] || { echo '::error::Published npm integrity differs from staged tarball'; exit 1; }
          else
            npm publish ./release/release.tgz --provenance --access public
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Verify npm registry identity
        if: steps.npm-publish.outputs.published == 'true'
        run: |
          set -euo pipefail
          PKG_NAME=$(tar -xOf release/release.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name")
          PKG_VERSION=$(tar -xOf release/release.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          SRI="sha512-$(openssl dgst -sha512 -binary release/release.tgz | openssl base64 -A)"
          # A publish takes time to reach the registry read path. Measured 309s
          # (azure 1.5.1) and 307s (gcp 1.3.1) for a first publish of a new name
          # on 2026-08-25; ~20s for a later version of an existing package.
          set +e
          for attempt in $(seq 1 40); do
            EXISTING=$(npm view "$PKG_NAME@$PKG_VERSION" dist.integrity 2>/dev/null)
            NPM_VIEW_STATUS=$?
            if [ "$NPM_VIEW_STATUS" -eq 0 ] && [ -n "$EXISTING" ]; then break; fi
            echo "::notice::registry read-back attempt $attempt/40 has not resolved yet"
            if [ "$attempt" -lt 40 ]; then sleep 15; fi
          done
          set -e
          [ -n "${EXISTING:-}" ] || { echo '::error::npm package is not visible after a successful publish'; exit 1; }
          [ "$EXISTING" = "$SRI" ] || { echo '::error::Published npm integrity differs from staged tarball'; exit 1; }
      - name: Report npm publish skipped
        if: steps.npm-publish.outputs.published != 'true'
        run: |
          PACKAGE_VERSION=$(tar -xOf release/release.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          echo "::warning::npm publish for @postman-cs/onboarding-api@$PACKAGE_VERSION did not complete (OIDC trusted publisher or registry error); GitHub Release remains authoritative; rerun this release after trusted publishing is restored"
          echo "npm publish for @postman-cs/onboarding-api@$PACKAGE_VERSION did not complete (OIDC trusted publisher or registry error); GitHub Release remains authoritative; rerun this release after trusted publishing is restored" >> "$GITHUB_STEP_SUMMARY"

  verify-release-e2e:
    needs: [classify, verify-package, publish]
    if: ${{ !cancelled() && needs.classify.outputs.release_kind == 'immutable' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.verifier.outputs.e2e_outcome }}
      correlation_id: ${{ steps.verifier.outputs.e2e_correlation_id }}
      manifest_sha256: ${{ steps.verifier.outputs.e2e_manifest_sha256 }}
      provider_commit: ${{ steps.verifier.outputs.e2e_provider_commit }}
      provider_tag: ${{ steps.verifier.outputs.e2e_provider_tag }}
      workflow_run_id: ${{ steps.verifier.outputs.e2e_workflow_run_id }}
      run_url: ${{ steps.verifier.outputs.e2e_run_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Mint composite release E2E dispatch App token
        id: e2e-dispatch-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SUITE_PIN_BOT_APP_ID }}
          private-key: ${{ secrets.SUITE_PIN_BOT_PRIVATE_KEY }}
          owner: postman-cs
          repositories: postman-actions-e2e
      - name: Require real released-composite E2E and await exact correlated run
        id: verifier
        env:
          E2E_DISPATCH_TOKEN: ${{ steps.e2e-dispatch-token.outputs.token }}
          E2E_GATE_MODE: enforce
          E2E_GATE_ACTION: postman-api-onboarding-action
          E2E_GATE_SUITE: full
          E2E_GATE_REF: ${{ github.ref_name }}
          E2E_GATE_RELEASE_COMMIT: ${{ github.sha }}
          E2E_GATE_SOURCE_DIGEST: ${{ needs.verify-package.outputs.release_tgz_sha256 }}
          E2E_GATE_PROVIDER_TAG: e2e-provider-v1.2.0
          E2E_GATE_PROVIDER_COMMIT: 53c5d10093b7dafb165d3caafbe3f1d70dec687d
          E2E_GATE_PROVIDER_SOURCE_DIGEST: 8c7ee211fccd2869f3901fcbc5ed154d6dea8e3d0d7d2e5312f6c0b57b4f6b78
          E2E_GATE_PEER_TAGS: '{"postman-cs/postman-bootstrap-action":"v2.22.0","postman-cs/postman-insights-onboarding-action":"v2.5.2","postman-cs/postman-repo-sync-action":"v2.11.1","postman-cs/postman-resolve-service-token-action":"v2.2.4","postman-cs/postman-smoke-flow-action":"v3.7.5"}'
        run: node scripts/verify-e2e-release.mjs

  advance-major-alias:
    needs: [classify, publish, verify-release-e2e]
    if: ${{ !cancelled() && needs.classify.outputs.release_kind == 'immutable' && needs.publish.result == 'success' && needs.verify-release-e2e.result == 'success' && needs.verify-release-e2e.outputs.outcome == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint rolling alias App token
        id: alias-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SUITE_PIN_BOT_APP_ID }}
          private-key: ${{ secrets.SUITE_PIN_BOT_PRIVATE_KEY }}
          owner: postman-cs
          repositories: postman-api-onboarding-action
          permission-contents: write
          permission-workflows: write
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ steps.alias-token.outputs.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Advance rolling major alias without regression
        env:
          VERIFIED_E2E_MANIFEST_SHA256: ${{ needs.verify-release-e2e.outputs.manifest_sha256 }}
          VERIFIED_E2E_PROVIDER_COMMIT: ${{ needs.verify-release-e2e.outputs.provider_commit }}
          VERIFIED_E2E_PROVIDER_TAG: ${{ needs.verify-release-e2e.outputs.provider_tag }}
        run: |
          set -euo pipefail
          [[ "$VERIFIED_E2E_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo '::error::verified E2E manifest digest is missing or invalid'
            exit 1
          }
          [ "$VERIFIED_E2E_PROVIDER_TAG" = 'e2e-provider-v1.2.0' ] || {
            echo '::error::verified E2E provider tag mismatch'
            exit 1
          }
          [ "$VERIFIED_E2E_PROVIDER_COMMIT" = '53c5d10093b7dafb165d3caafbe3f1d70dec687d' ] || {
            echo '::error::verified E2E provider commit mismatch'
            exit 1
          }
          VERSION="${GITHUB_REF_NAME#v}"; MAJOR="v${VERSION%%.*}"
          set +e
          ROWS=$(git ls-remote --tags origin "refs/tags/$MAJOR" "refs/tags/$MAJOR^{}" "refs/tags/$MAJOR.*")
          LS_STATUS=$?
          set -e
          [ "$LS_STATUS" -eq 0 ] || exit "$LS_STATUS"
          set +e
          CURRENT=$(printf '%s\n' "$ROWS" | node scripts/check-release-alias.mjs "$MAJOR" "$GITHUB_REF_NAME")
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 10 ]; then
            echo "::notice::Keeping newer $MAJOR alias at v$CURRENT"
            exit 0
          fi
          [ "$STATUS" -eq 0 ] || exit "$STATUS"
          RELEASE_TAG_REF="refs/tags/$GITHUB_REF_NAME"
          REMOTE_RELEASE_REFS="$(git ls-remote --exit-code --tags origin "$RELEASE_TAG_REF" "${RELEASE_TAG_REF}^{}")" || {
            echo "::error::failed to re-resolve immutable release tag $GITHUB_REF_NAME"
            exit 1
          }
          REMOTE_RELEASE_TAG=''
          REMOTE_RELEASE_PEELED=''
          while IFS=$'\t' read -r object ref; do
            if [ "$ref" = "$RELEASE_TAG_REF" ]; then
              [ -z "$REMOTE_RELEASE_TAG" ] || { echo '::error::duplicate immutable release tag ref'; exit 1; }
              REMOTE_RELEASE_TAG="$object"
            elif [ "$ref" = "${RELEASE_TAG_REF}^{}" ]; then
              [ -z "$REMOTE_RELEASE_PEELED" ] || { echo '::error::duplicate peeled release tag ref'; exit 1; }
              REMOTE_RELEASE_PEELED="$object"
            else
              echo "::error::unexpected ref while resolving immutable release tag: $ref"
              exit 1
            fi
          done <<< "$REMOTE_RELEASE_REFS"
          [[ "$REMOTE_RELEASE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::immutable release tag did not resolve to an object'; exit 1; }
          REMOTE_RELEASE_COMMIT="${REMOTE_RELEASE_PEELED:-$REMOTE_RELEASE_TAG}"
          [[ "$REMOTE_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::immutable release tag did not peel to a commit'; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::release workflow SHA is invalid'; exit 1; }
          [ "$REMOTE_RELEASE_COMMIT" = "$GITHUB_SHA" ] || {
            echo "::error::immutable release tag moved: expected $GITHUB_SHA, resolved $REMOTE_RELEASE_COMMIT"
            exit 1
          }
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -fa "$MAJOR" -m "Rolling $MAJOR alias -> $GITHUB_REF_NAME" "$GITHUB_SHA"
          git push origin "$MAJOR" --force
